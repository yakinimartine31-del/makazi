name: makazi

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: makazi/app
    container_name: makazi_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - ./docker/logs:/var/log/php
    networks:
      - makazi
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: makazi_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/logs:/var/log/nginx
    networks:
      - makazi

  mysql:
    image: mysql:8.0
    container_name: makazi_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "33060:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - makazi

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: makazi_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - makazi

networks:
  makazi:
    driver: bridge

volumes:
  mysql_data:
